<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 495 195" width="495" height="195">
  <defs>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9069cb" />
      <stop offset="100%" stop-color="#c4a8f3" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>
  <style>
    .bg { fill: #18151c; stroke: #373044; stroke-width: 1; rx: 12px; }
    .stat-val { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 28px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
    .stat-lbl { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #aebfb7; text-anchor: middle; letter-spacing: 0.5px; }
    .stat-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; fill: #7e738b; text-anchor: middle; }
    .divider { stroke: #2d2638; stroke-width: 1; stroke-dasharray: 3 3; }
    .ring-bg { fill: none; stroke: #2d2638; stroke-width: 4; }
    .ring-val { fill: none; stroke: url(#accentGrad); stroke-width: 4; stroke-linecap: round; stroke-dasharray: 120; stroke-dashoffset: 25; }
    .fire-icon { fill: #9069cb; }
  </style>

  <rect width="495" height="195" class="bg" filter="url(#shadow)" />

  <!-- Total Contributions Column -->
  <g transform="translate(82, 0)">
    <g transform="translate(0, 48)">
      <circle cx="0" cy="0" r="18" fill="rgba(144, 105, 203, 0.12)" />
      <!-- Fire flame icon -->
      <path class="fire-icon" transform="translate(-10, -11) scale(0.85)" d="M12 23c-4.97 0-9-4.03-9-9 0-4.03 2.92-7.83 6.07-10.74a1 1 0 011.63.58C11 7 13.5 8.5 15 10c1.4-2.1.8-4.6-.2-6.2a1 1 0 011.6-.9C19.7 5.2 21 9.8 21 14c0 4.97-4.03 9-9 9zm0-15.5C9.8 10.6 7 13.4 7 15.5 7 18 9.2 20 12 20s5-2 5-4.5c0-1.7-1.3-3.7-3.4-5.2-.4-.3-.8-.7-1.1-1.1-.2-.2-.4-.4-.5-.7z" />
    </g>
    <text x="0" y="98" class="stat-val">842</text>
    <text x="0" y="122" class="stat-lbl">Total Contributions</text>
    <text x="0" y="146" class="stat-sub">2025 — Present</text>
  </g>

  <!-- Divider 1 -->
  <line x1="165" y1="35" x2="165" y2="160" class="divider" />

  <!-- Current Streak Column -->
  <g transform="translate(247, 0)">
    <g transform="translate(0, 48)">
      <circle cx="0" cy="0" r="22" class="ring-bg" />
      <circle cx="0" cy="0" r="22" class="ring-val" transform="rotate(-90)" />
      <path class="fire-icon" transform="translate(-9, -10) scale(0.78)" d="M12 23c-4.97 0-9-4.03-9-9 0-4.03 2.92-7.83 6.07-10.74a1 1 0 011.63.58C11 7 13.5 8.5 15 10c1.4-2.1.8-4.6-.2-6.2a1 1 0 011.6-.9C19.7 5.2 21 9.8 21 14c0 4.97-4.03 9-9 9z" />
    </g>
    <text x="0" y="98" class="stat-val">34 Days</text>
    <text x="0" y="122" class="stat-lbl" fill="#9069cb" style="fill: #c4a8f3;">Current Streak</text>
    <text x="0" y="146" class="stat-sub">Active Daily Streak</text>
  </g>

  <!-- Divider 2 -->
  <line x1="330" y1="35" x2="330" y2="160" class="divider" />

  <!-- Longest Streak Column -->
  <g transform="translate(412, 0)">
    <g transform="translate(0, 48)">
      <circle cx="0" cy="0" r="18" fill="rgba(144, 105, 203, 0.12)" />
      <!-- Trophy / star icon -->
      <path class="fire-icon" transform="translate(-10, -10) scale(0.85)" d="M12 2l2.4 7.4h7.6l-6.1 4.5 2.3 7.1-6.2-4.4-6.2 4.4 2.3-7.1L2 9.4h7.6z" />
    </g>
    <text x="0" y="98" class="stat-val">112 Days</text>
    <text x="0" y="122" class="stat-lbl">Longest Streak</text>
    <text x="0" y="146" class="stat-sub">Personal Best</text>
  </g>
</svg>